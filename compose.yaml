services:
  downly:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Secrets can come from the environment instead of config.yaml.
    # Unset variables are not passed through.
    environment:
      - DOWNLY_BOT_TOKEN
      - DOWNLY_POSTGRES_URL
      - DOWNLY_ADMIN_IDS
      # Set to http://telegram-bot-api:8081 (with the local-api profile)
      # to send files up to 2GB.
      - DOWNLY_API_URL
    volumes:
      # The container runs as uid 10001: config.yaml must be readable by it
      # (e.g. chmod 644), or provide secrets via the variables above.
      - ./config.yaml:/app/config.yaml:ro
      - ./cookies:/app/cookies:ro
      - downly-tmp:/app/tmp
    restart: unless-stopped
    # Must exceed worker.shutdown_grace_seconds so running jobs can finish
    # or be requeued before Docker sends SIGKILL.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-config", "/app/config.yaml"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: downly
      # Override in a .env file next to this compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-downly}
      POSTGRES_DB: downly
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downly -d downly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted Bot API server: lifts the upload limit from 50MB to 2GB.
  # Enable with COMPOSE_PROFILES=local-api and TELEGRAM_API_ID/HASH (from
  # https://my.telegram.org) in .env, plus DOWNLY_API_URL above. Before the
  # first switch the bot must be logged out of the cloud API once; see README.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  downly-tmp: {}
  telegram-bot-api-data: {}
